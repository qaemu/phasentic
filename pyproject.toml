[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phasentic"
version = "0.1.0"
description = "Powder X-ray diffraction phase identification with a validated, reproducible method"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "qaemu" }]
keywords = ["powder diffraction", "XRD", "phase identification", "crystallography", "POW_COD", "materials science"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  # Space-group lookup for scoring and equivalence, and the charge-balance
  # tie-break between equivalent POW_COD entries: the validated result needs both.
  "gemmi>=0.7,<1",
  "pymatgen>=2024.10,<2027",
  # Local web interface
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/qaemu/phasentic"
Documentation = "https://github.com/qaemu/phasentic/tree/main/docs"
Issues = "https://github.com/qaemu/phasentic/issues"
Changelog = "https://github.com/qaemu/phasentic/blob/main/CHANGELOG.md"

[project.optional-dependencies]
evaluation = [
  "matplotlib>=3.8,<4",
]

[project.scripts]
phasentic = "phasentic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phasentic = ["resources/*.json", "web/*", "web/**/*"]
